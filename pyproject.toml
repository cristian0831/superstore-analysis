[project]
name = "superstore-analysis"
version = "0.1.0"
requires-python = ">=3.9"
dynamic = ["dependencies"]

[project.optional-dependencies]
prophet = ["prophet"]

[tool.setuptools]
packages = ["src", "src.forecasting"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: exercises the real db/superstore.db built by `python -m src.etl` (schema/data smoke checks)",
]
